title: Databiomics
author: Leandro de Mattos Pereira
url: "https://databiomics.com"
description: >
  Databiomics: bioinformatics, artificial intelligence and reproducible data
  resources for biotechnology, health, agriculture and computational biology.

  Leandro de Mattos Pereira is a biologist with MSc training in Biosciences and
  Biotechnology and a PhD in Computational and Systems Biology. His work
  integrates genomics, transcriptomics, proteomics, metagenomics, comparative
  genomics, molecular evolution, machine learning and scientific software.

  Public scientific resources, manuscripts, interactive atlases and exact
  supplementary data are organized under /New_articles/.

