---
layout: default
title: New_articles
---
<main class="new-articles-catalog">
  <style>
    .new-articles-catalog{max-width:1120px;margin:0 auto;padding:3rem 1.25rem;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#12263a}.catalog-hero{background:linear-gradient(135deg,#073b4c,#0b7285);color:#fff;border-radius:24px;padding:2.5rem;margin-bottom:2rem}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem}.article-card{border:1px solid #dbe7ef;border-radius:20px;padding:1.25rem;background:#fff;box-shadow:0 12px 28px rgba(7,59,76,.08)}.article-card h2{margin-top:0}.status{display:inline-block;background:#e7f5ff;color:#0b7285;border-radius:999px;padding:.35rem .7rem;font-weight:700}.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0}.tag{background:#f1f3f5;border-radius:999px;padding:.25rem .55rem;font-size:.85rem}.actions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}.button{display:inline-block;text-decoration:none;border-radius:999px;padding:.65rem .9rem;font-weight:700;background:#0b7285;color:#fff}.button.secondary{background:#1864ab}.button.ghost{background:#eef6f9;color:#073b4c}.notice{border-left:4px solid #0b7285;padding:.75rem 1rem;background:#f8fcfd;border-radius:10px}
  </style>
  <section class="catalog-hero">
    <p>Databiomics public research resources</p>
    <h1>New_articles</h1>
    <p>Scientific articles, curated databases and reproducible research result pages published by Databiomics.</p>
  </section>
  <p class="notice"><strong>If you use these data, please cite the associated article.</strong></p>
  <section id="article-cards" class="catalog-grid" aria-live="polite"></section>
  <noscript>Please enable JavaScript to load the article catalog from articles.json.</noscript>
</main>
<script>
(async function () {
  const container = document.getElementById('article-cards');
  try {
    const response = await fetch('articles.json');
    if (!response.ok) throw new Error('Could not load articles.json');
    const articles = await response.json();
    container.innerHTML = articles.map((article) => `
      <article class="article-card">
        <span class="status">${article.status}</span>
        <h2>${article.title}</h2>
        <p>${article.summary}</p>
        <p><strong>Authors:</strong> ${article.authors}</p>
        <div class="tags">${article.tags.map((tag) => `<span class="tag">${tag}</span>`).join('')}</div>
        <p><strong>Updated:</strong> ${article.updated_at}</p>
        <p><a href="${article.repository_url}" target="_blank" rel="noopener">GitHub repository</a></p>
        <p><strong>If you use these data, please cite the associated article.</strong></p>
        <div class="actions">
          <a class="button" href="${article.project_url}">Open project</a>
          <a class="button secondary" href="${article.article_pdf}">Download article</a>
          <a class="button ghost" href="${article.tables_url}">Download data</a>
        </div>
      </article>`).join('');
  } catch (error) {
    container.innerHTML = `<p role="alert">Article catalog unavailable: ${error.message}</p>`;
  }
}());
</script>
