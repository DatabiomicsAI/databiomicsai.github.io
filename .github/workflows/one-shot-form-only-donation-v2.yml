name: One-shot public donation cleanup v2

on:
  push:
    branches:
      - fix/form-only-donation-support-20260812

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/form-only-donation-support-20260812
          fetch-depth: 0

      - name: Keep donation only as a neutral form option
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          forbidden = re.compile(r'(?i)\bpix\b|doa(?:ç|c)[aã]o|doacao|donation')

          support = Path('apoie-projetos.html')
          text = support.read_text(encoding='utf-8')

          intro = '''<section class="section alt" id="databiomics-institucional">
            <div class="section-heading compact support-brand">
              <h1 class="support-projects-title">Projetos da Databiomics®</h1>
              <h2>Ciência, bioinformática e inovação em desenvolvimento</h2>
              <p>A Databiomics® desenvolve iniciativas técnico-científicas que integram bioinformática, inteligência artificial e ciência aplicada, com foco em soluções robustas e potencial de aplicação em biotecnologia, saúde e outras áreas das ciências da vida.</p>
              <p>Esta página apresenta projetos em desenvolvimento, prioridades técnicas e possibilidades de colaboração científica, institucional e estratégica.</p>
            </div>
          </section>'''
          text, n = re.subn(r'<section class="section alt" id="databiomics-institucional">.*?</section>', intro, text, count=1, flags=re.S)
          assert n == 1, 'intro section not found'

          needs = '''<section class="section alt" id="necessidades-apoio">
            <div class="section-heading compact">
              <h2>Desenvolvimento e prioridades estratégicas</h2>
              <h3>Infraestrutura, validação e colaborações</h3>
              <p>Esta área resume necessidades técnicas e oportunidades de cooperação relacionadas ao desenvolvimento dos projetos da Databiomics®.</p>
            </div>
            <div class="card-grid">
              <article class="info-card">
                <p><strong>Prioridades estratégicas de desenvolvimento</strong></p>
                <ul class="icon-list">
                  <li><strong>Infraestrutura computacional avançada:</strong> acesso a GPUs, recursos para treinamento e inferência de modelos, armazenamento em larga escala, backup e processamento intensivo de dados.</li>
                  <li><strong>Validação experimental:</strong> articulação técnico-científica com terceiros habilitados e laboratórios parceiros para validações experimentais quando necessárias aos projetos.</li>
                  <li><strong>Colaboração com laboratórios, instituições e indústrias:</strong> cooperação para co-desenvolvimento de soluções, pesquisa aplicada e execução de projetos de interesse mútuo.</li>
                </ul>
                <a class="button" href="#contato-apoio">Abrir formulário de contato</a>
              </article>
            </div>
          </section>'''
          text, n = re.subn(r'<section class="section alt" id="necessidades-apoio">.*?</section>', needs, text, count=1, flags=re.S)
          assert n == 1, 'needs section not found'

          heading = '''<section class="section alt" id="contato-apoio">
            <div class="section-heading compact">
              <h2>Contato, colaboração e propostas</h2>
              <p>Use este formulário para parcerias, colaborações técnico-científicas, propostas estratégicas ou outros assuntos relacionados aos projetos da Databiomics®.</p>
              <p>As mensagens são analisadas de acordo com o escopo e o alinhamento técnico-científico de cada proposta.</p>
            </div>'''
          text, n = re.subn(r'<section class="section alt" id="contato-apoio">\s*<div class="section-heading compact">.*?</div>', heading, text, count=1, flags=re.S)
          assert n == 1, 'contact heading not found'

          select = '''<select id="ap-tipo-contato" name="tipo_contato" required>
              <option value="" disabled selected>Selecione uma opção</option>
              <option>Apoio institucional</option>
              <option>Parceria científica</option>
              <option>Parceria estratégica</option>
              <option>Patrocínio de projeto</option>
              <option>Colaboração técnica especializada</option>
              <option>Investimento estratégico</option>
              <option>Proposta de cooperação de longo prazo</option>
              <option>Doação</option>
            </select>'''
          text, n = re.subn(r'<select id="ap-tipo-contato" name="tipo_contato" required>.*?</select>', select, text, count=1, flags=re.S)
          assert n == 1, 'contact type select not found'

          text, n = re.subn(r'\s*<div id="ap-pix-doacao".*?</div>\s*(?=<label for="ap-projeto">)', '\n\n    ', text, count=1, flags=re.S)
          assert n == 1, 'PIX box not found'

          for field_id in ('ap-valor-contribuicao', 'ap-data-pix', 'ap-comprovante'):
            text, n = re.subn(rf'\s*<label for="{field_id}">.*?</label>\s*<input id="{field_id}"[^>]*>', '', text, count=1, flags=re.S)
            assert n == 1, f'{field_id} not found'

          text, n = re.subn(r'\s*<script>\s*\(\(\) => \{\s*const select = document\.getElementById\(\x27ap-tipo-contato\x27\);.*?</script>', '', text, count=1, flags=re.S)
          assert n == 1, 'inline PIX script not found'

          hits = forbidden.findall(text)
          assert len(hits) == 1 and '<option>Doação</option>' in text, hits
          support.write_text(text, encoding='utf-8')

          institutional = Path('apoie-projetos-institucional-transparencia.html')
          inst = institutional.read_text(encoding='utf-8')
          inst = inst.replace(
            'Página dedicada a colaborações técnicas e científicas, apoio institucional, parcerias estratégicas e contribuições voluntárias para iniciativas e projetos independentes da Databiomics® em andamento.',
            'Página dedicada a colaborações técnicas e científicas, apoio institucional e parcerias estratégicas relacionadas às iniciativas e aos projetos da Databiomics® em andamento.'
          )
          inst = inst.replace(
            '<li><strong>Transparência:</strong> conduzir projetos, parcerias e apoios com clareza, accountability e responsabilidade.</li>',
            '<li><strong>Transparência:</strong> conduzir projetos, parcerias e colaborações com clareza, accountability e responsabilidade.</li>'
          )

          replacements = [
            (
              r'<section class="section" id="compromisso-recursos">.*?</section>',
              '''<section class="section" id="compromisso-recursos">
            <div class="section-heading compact">
              <h2>Compromisso com a condução responsável dos projetos</h2>
              <p>A Databiomics® busca desenvolver suas iniciativas com seriedade, responsabilidade, integridade científica e foco em soluções tecnicamente robustas e potencialmente úteis à sociedade.</p>
            </div>
          </section>'''
            ),
            (
              r'<section class="section alt" id="aviso-institucional">.*?</section>',
              '''<section class="section alt" id="aviso-institucional">
            <div class="section-heading compact">
              <h2>Aviso institucional</h2>
              <p>A Databiomics® é uma iniciativa independente em fase de estruturação. Colaborações institucionais, científicas e estratégicas são tratadas de acordo com sua natureza específica e, quando necessário, formalizadas adequadamente.</p>
            </div>
          </section>'''
            ),
            (
              r'<section class="section alt" id="patrocinio-institucional">.*?</section>',
              '''<section class="section alt" id="patrocinio-institucional">
            <div class="section-heading compact">
              <h2>Parcerias institucionais e cooperação estratégica</h2>
              <p>A Databiomics® está aberta ao diálogo com instituições, empresas, laboratórios e grupos de pesquisa quando houver alinhamento com sua missão científica, tecnológica e social.</p>
            </div>
          </section>'''
            ),
          ]
          for pattern, replacement in replacements:
            inst, n = re.subn(pattern, replacement, inst, count=1, flags=re.S)
            assert n == 1, pattern
          assert not forbidden.search(inst), 'institutional page still contains donation/PIX wording'
          institutional.write_text(inst, encoding='utf-8')

          layout = Path('_layouts/landing.html')
          layout_text = layout.read_text(encoding='utf-8')
          layout_text, n = re.subn(
            r"\s*\{% if page\.permalink == '/apoie-projetos/' %\}\s*<script src=\"\{\{ '/assets/js/support-projects-upgrade\.js' \| relative_url \}\}\?v=[^\"]+\"></script>\s*\{% endif %\}",
            '', layout_text, count=1, flags=re.S
          )
          assert n == 1, 'old support-projects JS include not found'
          layout.write_text(layout_text, encoding='utf-8')

          old_js = Path('assets/js/support-projects-upgrade.js')
          if old_js.exists():
            old_js.unlink()

          occurrences = []
          suffixes = {'.html', '.md', '.js', '.yml', '.yaml', '.scss', '.css', '.txt'}
          for path in Path('.').rglob('*'):
            if not path.is_file() or path.suffix.lower() not in suffixes:
              continue
            if '.git' in path.parts or '.github' in path.parts:
              continue
            try:
              content = path.read_text(encoding='utf-8')
            except UnicodeDecodeError:
              continue
            for match in forbidden.finditer(content):
              occurrences.append((str(path), match.group(0)))
          assert occurrences == [('apoie-projetos.html', 'Doação')], occurrences
          print('PASS: Doação remains only as a neutral form option; no PIX wording remains in public text/code.')
          PY

          rm -f .github/workflows/one-shot-form-only-donation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep donation only as a neutral form option"
          git push origin HEAD:fix/form-only-donation-support-20260812
