<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VaccineSaveLives — Databiomics</title>
  <meta name="description" content="VaccineSaveLives — iniciativa científica e educacional independente com apoio Databiomics.">
  <link rel="canonical" href="https://databiomics.com/vaccinesavelifes/">
  <link rel="preconnect" href="https://vaccinesavelives.streamlit.app" crossorigin>
  <link rel="dns-prefetch" href="//vaccinesavelives.streamlit.app">
  <meta name="theme-color" content="#FFFFFF">
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #FFFFFF;
      color-scheme: light;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #loading-screen.finished {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #vaccinesavelifes-app {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: 0;
      display: block;
      background: #FFFFFF;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease;
    }
    #vaccinesavelifes-app.ready {
      opacity: 1;
      visibility: visible;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(11, 43, 80, 0.10);
      border-top-color: #16823B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader { animation-duration: 1.5s; }
      #loading-screen,
      #vaccinesavelifes-app { transition: none; }
    }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-label="Carregando VaccineSaveLives">
    <div class="loader" aria-hidden="true"></div>
  </div>

  <iframe
    id="vaccinesavelifes-app"
    title="VaccineSaveLives"
    src="https://vaccinesavelives.streamlit.app/?embed=true&embed_options=hide_loading_screen&embed_options=light_theme"
    loading="eager"
    allow="clipboard-read; clipboard-write; web-share; microphone"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    (() => {
      const iframe = document.getElementById("vaccinesavelifes-app");
      const loadingScreen = document.getElementById("loading-screen");
      let revealed = false;

      function revealApplication() {
        if (revealed) return;
        revealed = true;
        iframe.classList.add("ready");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => loadingScreen.classList.add("finished"));
        });
      }

      iframe.addEventListener("load", () => {
        window.setTimeout(revealApplication, 1800);
      });

      window.setTimeout(revealApplication, 15000);
    })();
  </script>

  <noscript>
    <style>
      #loading-screen { display: none; }
      #vaccinesavelifes-app { opacity: 1; visibility: visible; }
    </style>
    <div style="padding:30px;font-family:Arial,sans-serif;text-align:center;">
      JavaScript é necessário para abrir o VaccineSaveLives.<br><br>
      <a href="https://vaccinesavelives.streamlit.app/">Abrir VaccineSaveLives</a>
    </div>
  </noscript>
</body>
</html>
